<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/syntax.css">

    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>

    <!-- Renders $...$ / $$...$$ LaTeX in project write-ups (kramdown leaves it as plain text otherwise) -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        svg: { fontCache: 'global' }
      };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>

    
    <title>{{ site.title }}</title>
    

</head>
<body>
    <!-- NAVBAR -->
     {% include navbar.html%}

     <!-- Desk-lamp light/dark toggle, fixed to the bottom-right corner — same icon
          and position as the home page. Icon: Lucide "lamp" (lucide.dev, ISC license).
          Kept outside <nav> since nav's backdrop-filter would otherwise become the
          containing block for this fixed-position button. -->
     <button class="lamp-toggle" id="themeToggle" aria-label="Toggle light and dark theme" title="Toggle light / dark theme">
         <span class="lamp-label" id="lampLabel">Dark Mode</span>
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
             <defs>
                 <radialGradient id="lampGlow" cx="50%" cy="35%" r="65%">
                     <stop offset="0%" stop-color="#ffe6a0" stop-opacity="0.9"/>
                     <stop offset="60%" stop-color="#ffd166" stop-opacity="0.3"/>
                     <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
                 </radialGradient>
             </defs>
             <circle class="lamp-glow" cx="12" cy="8" r="10" fill="url(#lampGlow)" stroke="none"/>
             <path d="M12 12v6"/>
             <path d="M4.077 10.615A1 1 0 0 0 5 12h14a1 1 0 0 0 .923-1.385l-3.077-7.384A2 2 0 0 0 15 2H9a2 2 0 0 0-1.846 1.23Z"/>
             <path d="M8 20a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1z"/>
         </svg>
     </button>

     <div class="page">{{content}}</div>

     
</body>

    {% include footer.html%}
</html>
