# Contact Form Setup
formspree-key: "xzepvzao"

# Active Theme Colors (Light Rich Creamy Yellow)
colors:
  text: "#2D2A26"          # Deep charcoal for crisp reading contrast
  border: "#EADDA6"        # Subtle creamy border
  link: "#9E7B00"          # Warm amber link color
  highlight: "#F3E39E"     # Creamy accent highlight
  background: "#FAF0CA"    # Light, rich cream background
  light_background: "#FFF9E6" # Soft off-white cream container fill


#########################################################################################################
# Build settings for the site. Editing the below may cause the site to malfunction.

collections:
  projects:
    output: true
    permalink: /projects/:path/

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
      indent: 0

plugins:
  - jekyll-feed

include:
  - _projects
